<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Siente — CAPINI Psicología</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Mulish:wght@600;700;800;900&display=swap" rel="stylesheet" />
<style>
 :root {
 --turq: #4DB6AC;
 --turq-deep: #2f8e85;
 --turq-ink: #1f6b63;
 --pink: #F48FB1;
 --pink-deep: #e06a92;
 --ink: #161918;
 }

 * { margin: 0; padding: 0; box-sizing: border-box; }
 html, body { width: 100%; height: 100%; background: #0b1211; overflow: hidden; font-family: 'Mulish', sans-serif; }

 #stage {
 position: relative;
 width: 100%;
 height: 100%;
 display: flex;
 align-items: center;
 justify-content: center;
 }

 #banner {
 position: relative;
 width: 1200px;
 height: 2000px;
 background: radial-gradient(130% 90% at 50% 0%, #ffffff 0%, #fef5f9 45%, #fce4ec 100%);
 overflow: hidden;
 transform-origin: center center;
 box-shadow: 0 30px 90px rgba(0,0,0,0.6);
 }

 #bg-deco { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

 #content {
 position: relative;
 z-index: 2;
 height: 100%;
 display: flex;
 flex-direction: column;
 padding: 100px 90px 80px;
 }

 .brand {
 display: inline-flex;
 align-items: center;
 gap: 16px;
 font-family: 'Mulish', sans-serif;
 font-weight: 900;
 font-size: 46px;
 letter-spacing: 4px;
 text-transform: uppercase;
 color: var(--turq-ink);
 }
 .brand .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--pink-deep); display: inline-block; }

 .headline {
 font-family: 'Montserrat', sans-serif;
 font-weight: 900;
 font-size: 280px;
 line-height: 0.92;
 letter-spacing: -5px;
 background: linear-gradient(100deg, #1f6b63 0%, #2f8e85 35%, #d99638 70%, #d86890 100%);
 -webkit-background-clip: text;
 -webkit-text-fill-color: transparent;
 background-clip: text;
 margin-top: 50px;
 filter: drop-shadow(0 6px 12px rgba(31,107,99,0.15));
 }

 .subhead {
 font-family: 'Mulish', sans-serif;
 font-weight: 800;
 font-size: 68px;
 line-height: 1.15;
 color: #6b3a4d;
 margin-top: 30px;
 }

 .chips {
 display: flex;
 flex-direction: column;
 gap: 20px;
 margin-top: 45px;
 align-items: flex-start;
 }
 .chip {
 display: inline-flex;
 align-items: center;
 gap: 18px;
 font-family: 'Mulish', sans-serif;
 font-weight: 800;
 font-size: 44px;
 color: var(--ink);
 background: rgba(255, 255, 255, 0.9);
 backdrop-filter: blur(8px);
 border: 3px solid rgba(244,143,177, 0.6);
 border-radius: 999px;
 padding: 20px 42px;
 box-shadow: 0 10px 25px rgba(224,106,146, 0.08);
 }
 .chip .pulse {
 width: 20px;
 height: 20px;
 border-radius: 50%;
 background: var(--pink);
 box-shadow: 0 0 12px var(--pink);
 }

 .contact-card {
 margin-top: auto;
 background: linear-gradient(140deg, #195852 0%, #29827a 60%, #1f6b63 100%);
 border-radius: 40px;
 padding: 60px 50px;
 color: #fff;
 box-shadow: 0 25px 50px rgba(25, 88, 82, 0.35);
 border: 2px solid rgba(255, 255, 255, 0.2);
 }

 .contact-title {
 font-family: 'Mulish', sans-serif;
 font-weight: 900;
 font-size: 48px;
 letter-spacing: 2px;
 text-transform: uppercase;
 color: #ffe082;
 margin-bottom: 25px;
 text-align: center;
 }

 .wa-box {
 display: flex;
 align-items: center;
 justify-content: center;
 gap: 28px;
 background: rgba(0, 0, 0, 0.15);
 padding: 24px;
 border-radius: 28px;
 border: 1px solid rgba(255,255,255,0.15);
 }
 .wa-icon {
 width: 100px;
 height: 100px;
 border-radius: 22px;
 background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
 display: flex;
 align-items: center;
 justify-content: center;
 box-shadow: 0 8px 20px rgba(37,211,102,0.4);
 flex: none;
 }
 .wa-icon svg { width: 58px; height: 58px; fill: #fff; }

 .wa-num {
 font-family: 'Montserrat', sans-serif;
 font-weight: 900;
 font-size: 96px;
 color: #ffffff;
 letter-spacing: 2px;
 line-height: 1;
 }

 .credits {
 text-align: center;
 margin-top: 35px;
 padding-top: 25px;
 border-top: 1px solid rgba(255, 255, 255, 0.2);
 font-family: 'Mulish', sans-serif;
 font-weight: 700;
 font-size: 32px;
 color: #d2f2ee;
 line-height: 1.5;
 }
 .credits strong { color: #fff; font-weight: 800; }
 .credits .socials {
 margin-top: 8px;
 color: #ffffff;
 font-weight: 900;
 letter-spacing: 3px;
 font-size: 34px;
 }

 @page { size: 600mm 1000mm; margin: 0; }
 @media print {
 html, body { background: #fff; }
 #stage { display: block; }
 #banner { transform: scale(1) !important; box-shadow: none; }
 }
</style>
</head>
<body>

 <div id="stage">
 <div id="banner">
 <!-- Arte Fondo SVG Vectorial -->
 <svg id="bg-deco" viewBox="0 0 1200 2000" preserveAspectRatio="xMidYMid slice">
 <defs>
 <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#F48FB1" stop-opacity="0.25"/>
 <stop offset="100%" stop-color="#4DB6AC" stop-opacity="0.2"/>
 </linearGradient>
 </defs>

 <path d="M-100 800 C 300 600, 800 1000, 1300 750 L 1300 2100 L -100 2100 Z" fill="url(#waveGrad)"/>
 <path d="M-100 1200 C 400 1000, 700 1400, 1300 1150 L 1300 2100 L -100 2100 Z" fill="#F48FB1" opacity="0.08"/>

 <g stroke="#F48FB1" stroke-width="4" fill="none" opacity="0.12">
 <path d="M 950 350 L 950 500 M 880 370 C 880 470, 1020 470, 1020 370 M 850 440 L 1050 440" stroke-width="8"/>
 <path d="M 200 1150 L 200 1270 M 150 1170 C 150 1250, 250 1250, 250 1170 M 130 1220 L 270 1220" stroke-width="6"/>
 </g>
 </svg>

 <div id="content">
 <!-- Logo / Marca -->
 <div class="brand">
 <span>CAPINI</span> <span class="dot"></span> <span>PSICOLOGÍA</span>
 </div>

 <!-- Título -->
 <h1 class="headline">Siente</h1>
 <p class="subhead">Tu cuerpo siempre<br/>te dice la verdad.</p>

 <!-- Viñetas / Chips -->
 <div class="chips">
 <div class="chip"><span class="pulse"></span>Atención plena</div>
 <div class="chip"><span class="pulse"></span>Conexión corporal</div>
 <div class="chip"><span class="pulse"></span>Escucha interna</div>
 </div>

 <!-- Tarjeta de contacto principal -->
 <div class="contact-card">
 <div class="contact-title">📱 Agenda tu primera sesión</div>

 <div class="wa-box">
 <div class="wa-icon">
 <svg viewBox="0 0 32 32">
 <path d="M16.01 3.2C9.06 3.2 3.41 8.85 3.4 15.8c0 2.22.58 4.39 1.69 6.3L3.3 28.8l6.86-1.8a12.56 12.56 0 0 0 5.84 1.49h.01c6.95 0 12.6-5.65 12.6-12.6 0-3.37-1.31-6.53-3.69-8.91A12.5 12.5 0 0 0 16.01 3.2Zm0 23.06h-.01a10.45 10.45 0 0 1-5.32-1.46l-.38-.23-3.95 1.04 1.05-3.85-.25-.4a10.4 10.4 0 0 1-1.6-5.56c0-5.77 4.7-10.47 10.47-10.47 2.8 0 5.42 1.09 7.4 3.07a10.4 10.4 0 0 1 3.06 7.41c0 5.78-4.7 10.48-10.47 10.48Z"/>
 </svg>
 </div>
 <div class="wa-num">341 136 5236</div>
 </div>

 <div class="credits">
 <strong>Céd. Prof. 1 324 6850</strong> · Tamazula de Gordiano, Jal.<br/>
 <div class="socials">@CAPINImx · FB · IG · TikTok</div>
 </div>
 </div>
 </div>
 </div>
 </div>

 <script>
 function fit() {
 var b = document.getElementById('banner');
 var w = (document.getElementById('stage').clientWidth || window.innerWidth) - 40;
 var h = (document.getElementById('stage').clientHeight || window.innerHeight) - 40;
 var s = Math.min(w / 1200, h / 2000);
 b.style.transform = 'scale(' + Math.max(s, 0.1) + ')';
 }
 fit();
 window.addEventListener('resize', fit);
 window.addEventListener('load', fit);
 </script>
</body>
</html>
