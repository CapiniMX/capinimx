<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Siente — CAPINI · Psicología (vertical)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Mulish:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --turq: #4DB6AC;
    --turq-deep: #2f8e85;
    --turq-ink: #1f6b63;
    --pink: #F48FB1;
    --pink-deep: #d24579;
    --pink-soft: #FCE4EC;
    --ink: #161918;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0c1413; overflow: hidden; font-family: 'Mulish', sans-serif; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #banner {
    position: relative;
    width: 1200px; height: 2000px;
    background: radial-gradient(140% 100% at 50% 0%, #ffffff 0%, #fef5f9 50%, #fce4ec 100%);
    overflow: hidden;
    transform-origin: center center;
    box-shadow: 0 40px 120px rgba(0,0,0,.5);
  }
  #bg-deco { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  #content {
    position: relative; z-index: 2; height: 100%;
    display: flex; flex-direction: column;
    padding: 90px 90px 0;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 14px;
    font-family: 'Mulish', sans-serif; font-weight: 800; font-size: 48px;
    letter-spacing: 3px; text-transform: uppercase;
    color: var(--pink-deep);
    align-self: flex-start;
  }
  .eyebrow::before {
    content: ''; width: 80px; height: 4px; background: var(--pink); border-radius: 2px;
  }
  .eyebrow .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--turq); }
  .headline {
    font-family: 'Montserrat', sans-serif; font-weight: 900;
    font-size: 220px; line-height: 0.95; letter-spacing: -6px;
    color: var(--pink-deep);
    margin-top: 40px;
  }
  .subhead {
    font-family: 'Mulish', sans-serif; font-weight: 700;
    font-size: 56px; line-height: 1.18; color: #6b3a4d;
    max-width: 950px; margin-top: 30px;
  }
  .chips { display: flex; flex-direction: column; gap: 18px; margin-top: 36px; align-items: flex-start; }
  .chip {
    display: inline-flex; align-items: center; gap: 16px;
    font-family: 'Mulish', sans-serif; font-weight: 700; font-size: 46px;
    color: var(--ink);
    background: #fff;
    border: 3px solid rgba(244,143,177,.55);
    border-radius: 999px;
    padding: 18px 36px;
    box-shadow: 0 4px 14px rgba(224,106,146,.06);
    line-height: 1;
  }
  .chip .pulse {
    width: 16px; height: 16px; border-radius: 50%; background: var(--pink);
    animation: heartbeat 1.2s ease-in-out infinite; flex: none;
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    25%      { transform: scale(1.3); }
    50%      { transform: scale(1); }
  }
  .allegory {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    margin-top: 40px;
  }
  .allegory svg { width: 60%; max-width: 600px; height: auto; }
  .footer {
    padding: 36px 0 50px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    border-top: 1.5px solid rgba(214,69,121,.18);
    margin-top: 30px;
  }
  .footer img { height: 110px; width: auto; display: block; }
  .footer .psic {
    font-family: 'Mulish', sans-serif; font-weight: 800; font-size: 42px;
    color: var(--pink-deep);
    margin-top: 8px; text-align: center;
  }
  .footer .agenda {
    font-family: 'Mulish', sans-serif; font-weight: 800; font-size: 42px;
    color: var(--turq-deep); text-align: center;
  }
  .footer .small {
    font-family: 'Mulish', sans-serif; font-weight: 700; font-size: 26px;
    color: var(--ink); opacity: 0.7; text-align: center; letter-spacing: 1px;
  }
  @page { size: 600mm 1000mm; margin: 0; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  @media print {
    html, body { background: #fff; }
    #stage { position: static; display: block; }
    #banner { transform: scale(0.47244) !important; transform-origin: top left; box-shadow: none; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="banner">
      <svg id="bg-deco" viewBox="0 0 1200 2000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <g stroke="#F48FB1" fill="none" opacity="0.15">
          <path d="M -100 300 Q 600 270 1300 300" stroke-width="3"/>
          <path d="M -100 1700 Q 600 1730 1300 1700" stroke-width="3"/>
          <path d="M -100 200 Q 600 180 1300 200" stroke-width="2"/>
          <path d="M -100 1800 Q 600 1820 1300 1800" stroke-width="2"/>
        </g>
        <g fill="#F48FB1" opacity="0.22">
          <circle cx="200" cy="280" r="7"/>
          <circle cx="900" cy="260" r="6"/>
          <circle cx="200" cy="1720" r="7"/>
          <circle cx="1000" cy="1760" r="6"/>
        </g>
        <g fill="#4DB6AC" opacity="0.20">
          <circle cx="100" cy="900" r="10"/>
          <circle cx="1100" cy="950" r="8"/>
        </g>
      </svg>

      <div id="content">
        <div class="eyebrow">
          <span>CAPINI</span><span class="dot"></span><span>PSICOLOGÍA</span>
        </div>
        <h1 class="headline">Siente.</h1>
        <p class="subhead">Tu cuerpo siempre<br/>te dice la verdad.</p>
        <div class="chips">
          <span class="chip"><span class="pulse"></span>Atención plena</span>
          <span class="chip"><span class="pulse"></span>Conexión corporal</span>
          <span class="chip"><span class="pulse"></span>Escucha interna</span>
        </div>

        <div class="allegory">
          <svg viewBox="0 0 600 700" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            <g fill="none" stroke="#F48FB1" stroke-linecap="round" opacity="0.5">
              <path d="M 90 380 Q 180 370 280 385" stroke-width="3.5"/>
              <path d="M 80 440 Q 180 430 290 445" stroke-width="3.5"/>
              <path d="M 90 500 Q 190 490 300 505" stroke-width="3.5"/>
            </g>
            <g fill="#F48FB1" opacity="0.55">
              <circle cx="60" cy="380" r="6"/>
              <circle cx="50" cy="440" r="7"/>
              <circle cx="60" cy="500" r="6"/>
            </g>

            <g fill="#FCE4EC" opacity="0.95">
              <ellipse cx="395" cy="170" rx="92" ry="108"/>
              <path d="M 354 268 L 354 320 Q 354 334 370 336 L 420 336 Q 436 334 436 320 L 436 268 Z"/>
              <path d="M 395 334
                       Q 312 336 258 358
                       Q 215 378 198 418
                       Q 192 446 204 472
                       L 218 580
                       Q 220 612 242 618
                       L 548 634
                       Q 574 634 578 610
                       L 574 514
                       Q 562 444 530 402
                       Q 492 366 445 354
                       Q 425 338 395 334 Z"/>
              <path d="M 256 363 Q 236 400 230 460 L 224 575 Q 224 600 246 605 L 272 605 L 284 500 Q 284 430 274 388 Z"/>
              <path d="M 534 363 Q 554 400 560 460 L 566 575 Q 566 600 544 605 L 518 605 L 506 500 Q 506 430 516 388 Z"/>
            </g>

            <g transform="translate(395 450)">
              <circle cx="0" cy="0" r="78" fill="none" stroke="#F48FB1" stroke-width="2" opacity="0.22"/>
              <circle cx="0" cy="0" r="58" fill="none" stroke="#F48FB1" stroke-width="2.5" opacity="0.45"/>
              <path d="M 0 -14
                       C -12 -38, -52 -38, -52 -10
                       C -52 12, -30 30, 0 52
                       C 30 30, 52 12, 52 -10
                       C 52 -38, 12 -38, 0 -14 Z"
                    fill="#d24579" opacity="0.95"/>
            </g>
          </svg>
        </div>

        <div class="footer">
          <img src="../../logo/capini-logo-transparent.png" alt="CAPINI — Creciendo Juntos" />
          <div class="psic">Psic. Ana María Vargas Hernández</div>
          <div class="agenda">Agenda tu primera sesión</div>
          <div class="small">Céd. Prof. 13246850 · Tamazula de Gordiano, Jal. · @CAPINImx</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    function fit() {
      var b = document.getElementById('banner');
      var s = Math.min(window.innerWidth / 1200, window.innerHeight / 2000);
      b.style.transform = 'scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    window.addEventListener('load', fit);
    fit();
  </script>
</body>
</html>
