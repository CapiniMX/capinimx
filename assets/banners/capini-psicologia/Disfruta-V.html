<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Disfruta — CAPINI · Psicología (vertical)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Mulish:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --turq: #4DB6AC;
    --turq-deep: #2f8e85;
    --turq-ink: #1f6b63;
    --pink: #F48FB1;
    --pink-deep: #e06a92;
    --pink-soft: #FCE4EC;
    --ink: #161918;
    --sun: #FFD58A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0c1413; overflow: hidden; font-family: 'Mulish', sans-serif; }
  #stage { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #banner {
    position: relative;
    width: 1200px; height: 2000px;
    background: radial-gradient(140% 100% at 50% 0%, #ffffff 0%, #fdf8ee 40%, #fce4ec 100%);
    overflow: hidden;
    transform-origin: center center;
    box-shadow: 0 40px 120px rgba(0,0,0,.5);
  }
  #bg-deco { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  #content {
    position: relative; z-index: 2; height: 100%;
    display: flex; flex-direction: column;
    padding: 90px 90px 0;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 14px;
    font-family: 'Mulish', sans-serif; font-weight: 800; font-size: 48px;
    letter-spacing: 3px; text-transform: uppercase;
    color: var(--turq-deep);
    align-self: flex-start;
  }
  .eyebrow::before {
    content: ''; width: 80px; height: 4px; background: var(--turq); border-radius: 2px;
  }
  .eyebrow .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--pink); }
  .headline {
    font-family: 'Montserrat', sans-serif; font-weight: 900;
    font-size: 220px; line-height: 0.95; letter-spacing: -6px;
    background: linear-gradient(95deg, var(--turq-deep) 0%, #4f9c95 35%, #c47ba1 70%, var(--pink-deep) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-top: 40px;
  }
  .subhead {
    font-family: 'Mulish', sans-serif; font-weight: 700;
    font-size: 61px; line-height: 1.18; color: #5e3a4d;
    max-width: 950px; margin-top: 30px;
  }
  .chips { display: flex; flex-direction: column; gap: 18px; margin-top: 250px; align-items: flex-start; }
  .chip {
    display: inline-flex; align-items: center; gap: 16px;
    font-family: 'Mulish', sans-serif; font-weight: 700; font-size: 46px;
    color: var(--ink);
    background: #fff;
    border: 3px solid rgba(255,213,138,.7);
    border-radius: 999px;
    padding: 18px 36px;
    box-shadow: 0 4px 14px rgba(214,158,46,.08);
    line-height: 1;
  }
  .chip .pulse {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--turq-deep);
    flex: none;
  }
  .allegory {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    margin-top: 40px;
  }
  .allegory svg { width: 60%; max-width: 600px; height: auto; }

  /* Bloque de contacto estándar (presente en las 4 verticales) */
  .contact-block {
    margin-top: 250px;
    background: linear-gradient(135deg, #1f6b63 0%, #2f8e85 100%);
    border-radius: 30px;
    padding: 44px 50px 36px;
    color: #fff;
    box-shadow: 0 18px 40px rgba(31,107,99,.3);
  }
  .contact-eyebrow {
    font-family: 'Mulish', sans-serif; font-weight: 800;
    font-size: 22px; letter-spacing: 2px; text-transform: uppercase;
    color: #ffd58a;
    margin-bottom: 16px; text-align: center;
  }
  .wa-row {
    display: flex; align-items: center; justify-content: center; gap: 26px;
    margin-bottom: 16px;
  }
  .wa-icon {
    width: 96px; height: 96px; flex: none;
    border-radius: 22px;
    background: linear-gradient(135deg, #5bd066 0%, #25a74f 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 22px rgba(37,167,79,.45);
  }
  .wa-icon svg { width: 56px; height: 56px; }
  .wa-num {
    font-family: 'Montserrat', sans-serif; font-weight: 900;
    font-size: 78px; color: #fff; letter-spacing: 1px; line-height: 1;
  }
  .creds {
    text-align: center;
    margin-top: 14px; padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,.18);
    font-family: 'Mulish', sans-serif; font-weight: 700; font-size: 26px;
    color: #cce8e6; line-height: 1.5;
  }
  .creds b { color: #fff; font-weight: 800; }
  .creds .networks { color: #d6efed; font-weight: 800; letter-spacing: 2px; }
  .footer {
    padding: 56px 0 60px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    border-top: 1.5px solid rgba(214,158,46,.18);
    margin-top: 30px;
  }
  .footer img { height: 110px; width: auto; display: block; }
  .footer .psic {
    font-family: 'Mulish', sans-serif; font-weight: 800; font-size: 42px;
    color: var(--turq-deep);
    margin-top: 8px; text-align: center;
  }
  .footer .agenda {
    font-family: 'Mulish', sans-serif; font-weight: 800; font-size: 42px;
    color: var(--pink-deep); text-align: center;
  }
  .footer .small {
    font-family: 'Mulish', sans-serif; font-weight: 700; font-size: 26px;
    color: var(--ink); opacity: 0.7; text-align: center; letter-spacing: 1px;
  }
  @page { size: 600mm 1000mm; margin: 0; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  @media print {
    html, body { background: #fff; }
    #stage { position: static; display: block; }
    #banner { transform: scale(0.47244) !important; transform-origin: top left; box-shadow: none; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="banner">

        <g stroke="#FFD58A" fill="none" opacity="0.20">
          <path d="M -100 1500 Q 600 1530 1300 1500" stroke-width="3"/>
          <path d="M -100 1620 Q 600 1650 1300 1620" stroke-width="2"/>
          <path d="M -100 1750 Q 600 1780 1300 1750" stroke-width="2"/>
          <path d="M -100 1880 Q 600 1900 1300 1880" stroke-width="2"/>
        </g>

        <g fill="#4DB6AC" opacity="0.22">
          <circle cx="100" cy="900" r="10"/>

      </svg>

      <div id="content">
        <div class="eyebrow">
          <span>CAPINI</span><span class="dot"></span><span>PSICOLOGÍA</span>
        </div>
        <h1 class="headline">Disfruta.</h1>
        <p class="subhead">La vida también se celebra<br/>en lo pequeño.</p>
        <div class="chips">
          <span class="chip"><span class="pulse"></span>Bienestar</span>

<!-- Bloque de contacto estándar (WhatsApp) -->
        <div class="contact-block">
          <div class="contact-eyebrow">📲 Agenda tu primera sesión</div>
          <div class="wa-row">
            <span class="wa-icon">
              <svg viewBox="0 0 32 32" fill="#fff" aria-hidden="true">
                <path d="M16.01 3.2C9.06 3.2 3.41 8.85 3.4 15.8c0 2.22.58 4.39 1.69 6.3L3.3 28.8l6.86-1.8a12.56 12.56 0 0 0 5.84 1.49h.01c6.95 0 12.6-5.65 12.6-12.6 0-3.37-1.31-6.53-3.69-8.91A12.5 12.5 0 0 0 16.01 3.2Zm0 23.06h-.01a10.45 10.45 0 0 1-5.32-1.46l-.38-.23-3.95 1.04 1.05-3.85-.25-.4a10.4 10.4 0 0 1-1.6-5.56c0-5.77 4.7-10.47 10.47-10.47 2.8 0 5.42 1.09 7.4 3.07a10.4 10.4 0 0 1 3.06 7.41c0 5.78-4.7 10.48-10.47 10.48Zm5.74-7.84c-.31-.16-1.86-.92-2.15-1.02-.29-.11-.5-.16-.71.16-.21.31-.82 1.02-1 1.24-.18.21-.37.24-.68.08-.31-.16-1.33-.49-2.53-1.56-.94-.83-1.57-1.86-1.75-2.18-.18-.31-.02-.48.14-.64.14-.14.31-.37.47-.55.16-.18.21-.31.31-.52.11-.21.05-.39-.03-.55-.08-.16-.71-1.71-.97-2.34-.26-.62-.52-.54-.71-.55-.18-.01-.39-.01-.6-.01-.21 0-.55.08-.84.39-.29.31-1.1 1.08-1.1 2.63 0 1.55 1.13 3.05 1.29 3.26.16.21 2.23 3.41 5.41 4.78.76.33 1.34.52 1.8.67.76.24 1.44.21 1.99.13.61-.09 1.86-.76 2.13-1.5.26-.73.26-1.36.18-1.5-.08-.13-.29-.21-.6-.37Z"/>

            </span>

          <div class="creds">

          </div>
        </div>

        
      </div>
    </div>
  </div>
  <script>
    function fit() {
      var b = document.getElementById('banner');
      var stage = document.getElementById('stage');
      // Preferir dimensiones del stage (parent directo) — más confiable en iframes
      var w = (stage && stage.clientWidth) || window.innerWidth || document.documentElement.clientWidth || 1;
      var h = (stage && stage.clientHeight) || window.innerHeight || document.documentElement.clientHeight || 1;
      var s = Math.min(w / 1200, h / 2000);
      b.style.transform = 'scale(' + s + ')';
      b.style.transformOrigin = 'center center';
    }
    function refit() {
      // Forzar re-fit con ResizeObserver para detectar cambios del iframe
      try {
        var ro = new ResizeObserver(fit);
        ro.observe(document.getElementById('stage'));
      } catch(e) {}
    }
    // Llamar fit en múltiples puntos del ciclo de vida
    fit();
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', fit);
    }
    window.addEventListener('load', function() { fit(); refit(); });
    window.addEventListener('resize', fit);
    // Re-fit tras el primer paint (algunos browsers miden mal antes)
    requestAnimationFrame(function() { fit(); requestAnimationFrame(fit); });
    // Re-fit adicional tras 100ms y 500ms (cuando fuentes externas ya cargaron)
    setTimeout(fit, 100);
    setTimeout(fit, 500);
    setTimeout(fit, 1500);
  </script>
</body>
</html>
