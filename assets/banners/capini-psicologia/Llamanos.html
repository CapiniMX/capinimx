<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Llámanos — CAPINI Psicología</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Mulish:wght@600;700;800;900&display=swap" rel="stylesheet" />
<style>
 :root {
 --turq: #4DB6AC;
 --turq-deep: #2f8e85;
 --turq-ink: #1f6b63;
 --pink: #F48FB1;
 --pink-deep: #e06a92;
 --ink: #161918;
 }

 * { margin: 0; padding: 0; box-sizing: border-box; }
 html, body { width: 100%; height: 100%; background: #0b1211; overflow: hidden; font-family: 'Mulish', sans-serif; }

 #stage { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }

 #banner {
 position: relative;
 width: 2400px;
 height: 800px;
 background: radial-gradient(130% 90% at 50% 0%, #ffffff 0%, #edf8f6 45%, #cdece7 100%);
 overflow: hidden;
 transform-origin: center center;
 box-shadow: 0 30px 90px rgba(0,0,0,0.6);
 }

 #bg-deco { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

 #content {
 position: relative;
 z-index: 2;
 height: 100%;
 display: grid;
 grid-template-columns: 1fr 1fr;
 padding: 60px 80px;
 gap: 40px;
 }

 .brand {
 position: absolute;
 top: 50px;
 left: 90px;
 display: inline-flex;
 align-items: center;
 gap: 14px;
 font-family: 'Mulish', sans-serif;
 font-weight: 900;
 font-size: 32px;
 letter-spacing: 3px;
 text-transform: uppercase;
 color: var(--turq-ink);
 }
 .brand .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--pink-deep); display: inline-block; }

 .message {
 height: 100%;
 display: flex;
 flex-direction: column;
 justify-content: center;
 padding-top: 50px;
 padding-right: 30px;
 }

 .headline {
 font-family: 'Montserrat', sans-serif;
 font-weight: 900;
 font-size: 220px;
 line-height: 0.92;
 letter-spacing: -6px;
 background: linear-gradient(100deg, #1f6b63 0%, #2f8e85 35%, #d99638 70%, #d86890 100%);
 -webkit-background-clip: text;
 -webkit-text-fill-color: transparent;
 background-clip: text;
 filter: drop-shadow(0 4px 10px rgba(31,107,99,0.15));
 }

 .subhead {
 font-family: 'Mulish', sans-serif;
 font-weight: 800;
 font-size: 44px;
 line-height: 1.15;
 color: var(--turq-ink);
 margin-top: 18px;
 }

 .chips {
 display: flex;
 flex-wrap: wrap;
 gap: 12px;
 margin-top: 28px;
 }
 .chip {
 display: inline-flex;
 align-items: center;
 gap: 12px;
 font-family: 'Mulish', sans-serif;
 font-weight: 800;
 font-size: 28px;
 color: var(--ink);
 background: rgba(255, 255, 255, 0.9);
 backdrop-filter: blur(8px);
 border: 2.5px solid rgba(77,182,172, 0.6);
 border-radius: 999px;
 padding: 14px 26px;
 box-shadow: 0 8px 20px rgba(31,107,99, 0.08);
 }
 .chip .pulse {
 width: 14px;
 height: 14px;
 border-radius: 50%;
 background: var(--turq);
 box-shadow: 0 0 10px var(--turq);
 }

 /* En Llamanos horizontal, el contact-card es más grande porque es la pieza de conversión */
 .contact-card {
 align-self: center;
 background: linear-gradient(140deg, #195852 0%, #29827a 60%, #1f6b63 100%);
 border-radius: 36px;
 padding: 56px 50px;
 color: #fff;
 box-shadow: 0 25px 50px rgba(25, 88, 82, 0.35);
 border: 2px solid rgba(255, 255, 255, 0.2);
 }

 .contact-title {
 font-family: 'Mulish', sans-serif;
 font-weight: 900;
 font-size: 36px;
 letter-spacing: 2px;
 text-transform: uppercase;
 color: #ffe082;
 margin-bottom: 24px;
 text-align: center;
 }

 .wa-box {
 display: flex;
 align-items: center;
 justify-content: center;
 gap: 28px;
 background: rgba(0, 0, 0, 0.15);
 padding: 24px;
 border-radius: 26px;
 border: 1px solid rgba(255,255,255,0.15);
 }
 .wa-icon {
 width: 110px;
 height: 110px;
 border-radius: 22px;
 background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
 display: flex;
 align-items: center;
 justify-content: center;
 box-shadow: 0 8px 20px rgba(37,211,102,0.4);
 flex: none;
 }
 .wa-icon svg { width: 64px; height: 64px; fill: #fff; }

 .wa-num {
 font-family: 'Montserrat', sans-serif;
 font-weight: 900;
 font-size: 110px;
 color: #ffffff;
 letter-spacing: 2px;
 line-height: 1;
 }

 .credits {
 text-align: center;
 margin-top: 28px;
 padding-top: 22px;
 border-top: 1px solid rgba(255, 255, 255, 0.2);
 font-family: 'Mulish', sans-serif;
 font-weight: 700;
 font-size: 28px;
 color: #d2f2ee;
 line-height: 1.4;
 }
 .credits strong { color: #fff; font-weight: 800; }
 .credits .socials {
 margin-top: 8px;
 color: #ffffff;
 font-weight: 900;
 letter-spacing: 3px;
 font-size: 32px;
 }

 @page { size: 3000mm 1000mm; margin: 0; }
 @media print {
 html, body { background: #fff; }
 #stage { display: block; }
 #banner { transform: scale(1) !important; box-shadow: none; }
 }
</style>
</head>
<body>

 <div id="stage">
 <div id="banner">
 <svg id="bg-deco" viewBox="0 0 2400 800" preserveAspectRatio="xMidYMid slice">
 <defs>
 <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#4DB6AC" stop-opacity="0.25"/>
 <stop offset="100%" stop-color="#F48FB1" stop-opacity="0.2"/>
 </linearGradient>
 </defs>

 <path d="M-100 400 C 600 300, 1400 600, 2500 350 L 2500 1000 L -100 1000 Z" fill="url(#waveGrad)"/>
 <path d="M-100 600 C 700 500, 1300 800, 2500 550 L 2500 1000 L -100 1000 Z" fill="#2f8e85" opacity="0.08"/>

 <g stroke="#2f8e85" stroke-width="3" fill="none" opacity="0.10">
 <path d="M 1900 120 L 1900 240 M 1850 140 C 1850 220, 1950 220, 1950 140 M 1820 200 L 1980 200" stroke-width="6"/>
 <path d="M 200 600 L 200 720 M 150 620 C 150 700, 250 700, 250 620 M 130 670 L 270 670" stroke-width="5"/>
 </g>
 </svg>

 <div class="brand">
 <span>CAPINI</span> <span class="dot"></span> <span>PSICOLOGÍA</span>
 </div>

 <div id="content">
 <div class="message">
 <h1 class="headline">Llámanos</h1>
 <p class="subhead">El primer paso es una llamada.</p>
 <div class="chips">
 <div class="chip"><span class="pulse"></span>WhatsApp directo</div>
 <div class="chip"><span class="pulse"></span>Sin compromiso</div>
 <div class="chip"><span class="pulse"></span>Atención confidencial</div>
 </div>
 </div>

 <div class="contact-card">
 <div class="contact-title">📱 Agenda tu primera sesión</div>
 <div class="wa-box">
 <div class="wa-icon">
 <svg viewBox="0 0 32 32">
 <path d="M16.01 3.2C9.06 3.2 3.41 8.85 3.4 15.8c0 2.22.58 4.39 1.69 6.3L3.3 28.8l6.86-1.8a12.56 12.56 0 0 0 5.84 1.49h.01c6.95 0 12.6-5.65 12.6-12.6 0-3.37-1.31-6.53-3.69-8.91A12.5 12.5 0 0 0 16.01 3.2Zm0 23.06h-.01a10.45 10.45 0 0 1-5.32-1.46l-.38-.23-3.95 1.04 1.05-3.85-.25-.4a10.4 10.4 0 0 1-1.6-5.56c0-5.77 4.7-10.47 10.47-10.47 2.8 0 5.42 1.09 7.4 3.07a10.4 10.4 0 0 1 3.06 7.41c0 5.78-4.7 10.48-10.47 10.48Z"/>
 </svg>
 </div>
 <div class="wa-num">341 136 5236</div>
 </div>
 <div class="credits">
 <strong>Céd. Prof. 1 324 6850</strong> · Tamazula de Gordiano, Jal.<br/>
 <div class="socials">@CAPINImx · FB · IG · TikTok</div>
 </div>
 </div>
 </div>
 </div>
 </div>

 <script>
 function fit() {
 var b = document.getElementById('banner');
 var w = (document.getElementById('stage').clientWidth || window.innerWidth) - 40;
 var h = (document.getElementById('stage').clientHeight || window.innerHeight) - 40;
 var s = Math.min(w / 2400, h / 800);
 b.style.transform = 'scale(' + Math.max(s, 0.1) + ')';
 }
 fit();
 window.addEventListener('resize', fit);
 window.addEventListener('load', fit);
 </script>
</body>
</html>
