<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Disfruta — CAPINI · Psicología</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Mulish:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --turq: #4DB6AC;
    --turq-deep: #2f8e85;
    --turq-ink: #1f6b63;
    --pink: #F48FB1;
    --pink-deep: #e06a92;
    --pink-soft: #FCE4EC;
    --ink: #161918;
    --sun: #FFD58A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: #0c1413; overflow: hidden;
    font-family: 'Mulish', sans-serif;
  }
  #stage {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  }
  #banner {
    position: relative;
    width: 2400px; height: 800px;
    /* Fondo cálido turquesa → rosa suave */
    background: radial-gradient(120% 140% at 50% 50%, #ffffff 0%, #fdf8ee 35%, #fce4ec 100%);
    overflow: hidden;
    transform-origin: center center;
    box-shadow: 0 40px 120px rgba(0,0,0,.5);
  }

  #bg-deco {
    position: absolute; inset: 0; width: 100%; height: 100%;
    z-index: 0; pointer-events: none;
  }

  #content {
    position: relative; z-index: 2; height: 100%;
    display: grid;
    grid-template-columns: 1.5fr 1fr;
  }

  /* LEFT */
  .message {
    height: 100%;
    display: flex; flex-direction: column; justify-content: flex-start;
    padding: 78px 50px 130px 130px;
    gap: 22px;
  }
  .series-tag {
    display: inline-flex; align-items: center; gap: 14px;
    font-family: 'Mulish', sans-serif; font-weight: 800; font-size: 28px;
    letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--turq-deep);
  }
  .series-tag::before {
    content: ''; width: 56px; height: 3px; background: var(--turq); border-radius: 2px;
  }
  .series-tag .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--pink);
  }

  /* Headline con gradient turquesa→rosa (mix completo) */
  .headline {
    font-family: 'Montserrat', sans-serif; font-weight: 900;
    font-size: 240px; line-height: 0.95; letter-spacing: -7px;
    background: linear-gradient(95deg, var(--turq-deep) 0%, #4f9c95 35%, #c47ba1 70%, var(--pink-deep) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-right: 60px;
  }

  .subhead {
    font-family: 'Mulish', sans-serif; font-weight: 700;
    font-size: 46px; line-height: 1.2; color: #5e3a4d;
    max-width: 1100px;
    margin-top: 4px;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 28px; }
  .chip {
    display: inline-flex; align-items: center; gap: 12px;
    font-family: 'Mulish', sans-serif; font-weight: 700; font-size: 28px;
    color: var(--ink);
    background: #fff;
    border: 2.5px solid rgba(255,213,138,.7);
    border-radius: 999px;
    padding: 14px 26px;
    box-shadow: 0 4px 14px rgba(214,158,46,.08);
    line-height: 1;
  }
  .chip .pulse {
    width: 12px; height: 12px; border-radius: 50%;
    background: linear-gradient(135deg, var(--turq) 0%, var(--pink) 100%);
    flex: none;
  }

  /* RIGHT: silueta con sol radiante */
  .allegory {
    position: relative; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 60px 80px 130px 30px;
  }
  .allegory svg { width: 100%; height: 100%; }

  .footer {
    position: absolute; left: 0; right: 0; bottom: 38px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    z-index: 3;
  }
  .footer img {
    height: 86px; width: auto; display: block;
  }
  .footer .tag {
    font-family: 'Mulish', sans-serif; font-weight: 800; font-size: 20px;
    letter-spacing: 2px; text-transform: uppercase; color: var(--turq-deep);
    opacity: 0.85;
  }

  @page { size: 300mm 100mm; margin: 0; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  @media print {
    html, body { background: #fff; }
    #stage { position: static; display: block; }
    #banner { transform: scale(0.47244) !important; transform-origin: top left; box-shadow: none; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="banner">

      <!-- Background: ondas cálidas -->
      <svg id="bg-deco" viewBox="0 0 2400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <g stroke="#FFD58A" fill="none" opacity="0.30">
          <path d="M -100 100 Q 400 60 800 100" stroke-width="2.4"/>
          <path d="M -100 170 Q 400 140 800 170" stroke-width="1.8"/>
          <path d="M 1620 80 Q 2000 60 2500 100" stroke-width="2.4"/>
          <path d="M 1620 150 Q 2000 130 2500 170" stroke-width="1.8"/>
        </g>
        <g stroke="#F48FB1" fill="none" opacity="0.18">
          <path d="M -100 720 Q 400 750 800 720" stroke-width="2.4"/>
          <path d="M -100 650 Q 400 680 800 650" stroke-width="1.8"/>
          <path d="M 1620 700 Q 2000 720 2500 720" stroke-width="2.4"/>
          <path d="M 1620 640 Q 2000 660 2500 640" stroke-width="1.8"/>
        </g>
        <g fill="#FFD58A" opacity="0.45">
          <circle cx="120" cy="90" r="5"/><circle cx="380" cy="60" r="3"/>
          <circle cx="640" cy="80" r="4"/><circle cx="1820" cy="70" r="5"/>
          <circle cx="2100" cy="110" r="3"/><circle cx="2280" cy="80" r="4"/>
          <circle cx="120" cy="710" r="5"/><circle cx="440" cy="740" r="3"/>
          <circle cx="1980" cy="730" r="4"/>
        </g>
        <g fill="#4DB6AC" opacity="0.22">
          <circle cx="80" cy="450" r="6"/><circle cx="1700" cy="50" r="4"/>
        </g>
      </svg>

      <div id="content">

        <!-- LEFT -->
        <div class="message">
          <div class="series-tag">
            <span>CAPINI</span><span class="dot"></span><span>PSICOLOGÍA</span>
          </div>
          <h1 class="headline">Disfruta.</h1>
          <p class="subhead">La vida también se celebra<br/>en lo pequeño.</p>
          <div class="chips">
            <span class="chip"><span class="pulse"></span>Bienestar</span>
            <span class="chip"><span class="pulse"></span>Terapia positiva</span>
            <span class="chip"><span class="pulse"></span>Plenitud</span>
          </div>
        </div>

        <!-- RIGHT: silueta con sol radiante detrás + elementos volando -->
        <div class="allegory">
          <svg viewBox="0 0 800 700" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            <!-- SOL RADIANTE detrás de la silueta -->
            <g transform="translate(480 320)">
              <!-- Rayos del sol -->
              <g stroke="#FFD58A" stroke-width="6" stroke-linecap="round" opacity="0.7">
                <line x1="0" y1="-260" x2="0" y2="-200"/>
                <line x1="184" y1="-184" x2="142" y2="-142"/>
                <line x1="260" y1="0" x2="200" y2="0"/>
                <line x1="184" y1="184" x2="142" y2="142"/>
                <line x1="0" y1="260" x2="0" y2="200"/>
                <line x1="-184" y1="184" x2="-142" y2="142"/>
                <line x1="-260" y1="0" x2="-200" y2="0"/>
                <line x1="-184" y1="-184" x2="-142" y2="-142"/>
              </g>
              <g stroke="#FFD58A" stroke-width="3" stroke-linecap="round" opacity="0.5">
                <line x1="92" y1="-220" x2="78" y2="-185"/>
                <line x1="220" y1="-92" x2="185" y2="-78"/>
                <line x1="220" y1="92" x2="185" y2="78"/>
                <line x1="92" y1="220" x2="78" y2="185"/>
                <line x1="-92" y1="220" x2="-78" y2="185"/>
                <line x1="-220" y1="92" x2="-185" y2="78"/>
                <line x1="-220" y1="-92" x2="-185" y2="-78"/>
                <line x1="-92" y1="-220" x2="-78" y2="-185"/>
              </g>
              <!-- Disco solar -->
              <circle cx="0" cy="0" r="180" fill="#FFD58A" opacity="0.35"/>
              <circle cx="0" cy="0" r="150" fill="#FFD58A" opacity="0.55"/>
            </g>

            <!-- Mariposas / elementos volando alrededor -->
            <g fill="#F48FB1" opacity="0.85">
              <!-- Mariposa 1 (arriba izq) -->
              <g transform="translate(80 110) scale(0.9)">
                <path d="M 0 0 C -18 -22, -38 -10, -22 8 C -32 18, -22 28, -8 22 C -4 26, 4 26, 8 22 C 22 28, 32 18, 22 8 C 38 -10, 18 -22, 0 0 Z"/>
              </g>
              <!-- Mariposa 2 (arriba der) -->
              <g transform="translate(540 90) scale(0.7) rotate(15)">
                <path d="M 0 0 C -18 -22, -38 -10, -22 8 C -32 18, -22 28, -8 22 C -4 26, 4 26, 8 22 C 22 28, 32 18, 22 8 C 38 -10, 18 -22, 0 0 Z"/>
              </g>
              <!-- Mariposa 3 (centro der) -->
              <g transform="translate(560 320) scale(0.6) rotate(-20)">
                <path d="M 0 0 C -18 -22, -38 -10, -22 8 C -32 18, -22 28, -8 22 C -4 26, 4 26, 8 22 C 22 28, 32 18, 22 8 C 38 -10, 18 -22, 0 0 Z"/>
              </g>
            </g>
            <g fill="#4DB6AC" opacity="0.85">
              <!-- Mariposa turquesa (izq medio) -->
              <g transform="translate(60 280) scale(0.7) rotate(-25)">
                <path d="M 0 0 C -18 -22, -38 -10, -22 8 C -32 18, -22 28, -8 22 C -4 26, 4 26, 8 22 C 22 28, 32 18, 22 8 C 38 -10, 18 -22, 0 0 Z"/>
              </g>
            </g>

            <!-- Silueta humana de frente, brazos abiertos hacia el sol (celebrar / disfrutar) -->
            <g fill="#FCE4EC" opacity="0.95">
              <!-- Cabeza -->
              <ellipse cx="480" cy="150" rx="82" ry="96"/>
              <!-- Cuello -->
              <path d="M 443 236 L 443 285 Q 443 298 457 300 L 503 300 Q 517 298 517 285 L 517 236 Z"/>
              <!-- Torso -->
              <path d="M 480 298
                       Q 405 300 355 320
                       Q 315 338 300 375
                       Q 295 400 305 425
                       L 317 525
                       Q 319 555 339 560
                       L 623 575
                       Q 647 575 650 552
                       L 647 465
                       Q 637 400 607 360
                       Q 573 328 530 315
                       Q 510 302 480 298 Z"/>
              <!-- Brazo izquierdo extendido hacia arriba-izq -->
              <path d="M 353 325
                       Q 305 300 260 260
                       Q 230 225 215 195
                       Q 210 180 220 175
                       Q 235 175 260 200
                       Q 300 230 335 275
                       Q 355 300 365 320 Z"/>
              <!-- Brazo derecho extendido hacia arriba-der (recortado intencionalmente por borde del viewBox) -->
              <path d="M 607 325
                       Q 660 300 705 260
                       Q 735 225 750 195
                       Q 755 180 745 175
                       Q 730 175 705 200
                       Q 665 230 630 275
                       Q 610 300 600 320 Z"/>
            </g>

            <!-- Cara feliz sutil (línea curva sonrisa) -->
            <path d="M 455 180 Q 480 195 505 180" stroke="#e06a92" stroke-width="3" fill="none" opacity="0.7" stroke-linecap="round"/>
          </svg>
        </div>

      </div>

      <!-- Footer -->
      <div class="footer">
        <img src="../../logo/capini-logo-transparent.png" alt="CAPINI — Creciendo Juntos" />
        <div class="tag">Creciendo Juntos</div>
      </div>

    </div>
  </div>

  <script>
    function fit() {
      var b = document.getElementById('banner');
      var s = Math.min(window.innerWidth / 2400, window.innerHeight / 800);
      b.style.transform = 'scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    window.addEventListener('load', fit);
    fit();
  </script>
</body>
</html>
