<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Día Mundial de la Lucha contra la Depresión — CAPINI Psicología</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Mulish:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --turq: #4DB6AC;
    --turq-deep: #2f8e85;
    --turq-ink: #1f6b63;
    --turq-cl: #B2DFDB;
    --pink: #F48FB1;
    --pink-deep: #e06a92;
    --ink: #161918;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; min-height: 100%; background: #0c1413;
    font-family: 'Mulish', sans-serif;
    overflow-x: hidden;
  }
  #stage {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 30px 20px;
  }
  /* Canvas 3:4 → 1080×1440 (escalable) */
  #poster {
    position: relative;
    width: 864px;
    aspect-ratio: 3 / 4;
    background: #ffffff;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.4);
    transform-origin: center center;
  }
  /* Imagen de fondo generada */
  #bg-image {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; object-position: center;
    z-index: 1;
  }

  /* Overlay gradiente sutil arriba para que el texto resalte */
  #bg-gradient {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background:
      linear-gradient(180deg, rgba(255,255,255,.78) 0%, rgba(255,255,255,.35) 18%, rgba(255,255,255,0) 36%, rgba(255,255,255,0) 72%, rgba(31,107,99,.92) 88%, rgba(31,107,99,.98) 100%);
  }

  /* ZONA SUPERIOR — Headline */
  .top {
    position: absolute; top: 0; left: 0; right: 0;
    z-index: 3;
    padding: 30px 50px 24px;
    text-align: center;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: 'Mulish', sans-serif; font-weight: 800;
    font-size: 15px; letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--pink-deep);
    margin-bottom: 14px;
    background: rgba(255,255,255,.65);
    padding: 6px 14px;
    border-radius: 999px;
    backdrop-filter: blur(2px);
  }
  .eyebrow::before, .eyebrow::after {
    content: ''; width: 22px; height: 2px; background: var(--pink); border-radius: 2px;
  }
  .headline {
    font-family: 'Montserrat', sans-serif; font-weight: 900;
    font-size: 52px; line-height: 1.04; letter-spacing: -1.5px;
    color: var(--turq-ink);
    max-width: 720px; margin: 0 auto;
    text-shadow: 0 1px 12px rgba(255,255,255,.6);
  }
  .headline em {
    font-style: normal; color: var(--pink-deep);
  }

  /* ZONA INFERIOR — Contacto */
  .bottom {
    position: absolute; bottom: 0; left: 0; right: 0;
    z-index: 3;
    padding: 36px 40px 30px;
    color: #ffffff;
    text-align: center;
  }
  .wa-row {
    display: flex; align-items: center; justify-content: center; gap: 24px;
    margin-bottom: 10px;
  }
  .wa-icon {
    width: 60px; height: 60px; flex: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #5bd066 0%, #25a74f 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 18px rgba(37,167,79,.4);
  }
  .wa-icon svg { width: 36px; height: 36px; }
  .wa-num {
    font-family: 'Montserrat', sans-serif; font-weight: 900;
    font-size: 50px; color: #ffffff; letter-spacing: 1px;
    line-height: 1;
  }
  .wa-cta {
    font-family: 'Mulish', sans-serif; font-weight: 700;
    font-size: 17px; color: #d6efed;
    margin-top: 6px; letter-spacing: 0.5px;
  }
  .socials {
    font-family: 'Mulish', sans-serif; font-weight: 800;
    font-size: 17px; color: #ffffff;
    margin-top: 18px; letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .socials .handle { color: #ffd58a; margin-right: 12px; }
  .socials .div { opacity: 0.4; margin: 0 10px; }
  .loc {
    font-family: 'Mulish', sans-serif; font-weight: 700;
    font-size: 15px; color: #d6efed; margin-top: 10px;
    opacity: 0.85;
  }

  /* Print: 200mm x 267mm page (proporción 3:4) */
  @page { size: 200mm 267mm; margin: 0; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  @media print {
    html, body { background: #fff; }
    #stage { padding: 0; min-height: auto; display: block; }
    #poster { box-shadow: none; transform: none !important; width: 200mm; height: 267mm; }
  }

  @media (max-width: 900px) {
    #poster { width: 100%; max-width: 500px; }
    .headline { font-size: 32px; }
    .wa-num { font-size: 36px; }
    .wa-icon { width: 48px; height: 48px; }
    .wa-icon svg { width: 28px; height: 28px; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="poster">
      <img id="bg-image" src="poster-depresion-bg.png" alt="" />

      <div id="bg-gradient"></div>

      <!-- ZONA SUPERIOR -->
      <div class="top">
        <div class="eyebrow">Día Mundial · 13 enero</div>
        <h1 class="headline">No tienes que estar<br/><em>bien todo el tiempo.</em></h1>
      </div>

      <!-- ZONA INFERIOR -->
      <div class="bottom">
        <div class="wa-row">
          <span class="wa-icon">
            <svg viewBox="0 0 32 32" fill="#fff" aria-hidden="true">
              <path d="M16.01 3.2C9.06 3.2 3.41 8.85 3.4 15.8c0 2.22.58 4.39 1.69 6.3L3.3 28.8l6.86-1.8a12.56 12.56 0 0 0 5.84 1.49h.01c6.95 0 12.6-5.65 12.6-12.6 0-3.37-1.31-6.53-3.69-8.91A12.5 12.5 0 0 0 16.01 3.2Zm0 23.06h-.01a10.45 10.45 0 0 1-5.32-1.46l-.38-.23-3.95 1.04 1.05-3.85-.25-.4a10.4 10.4 0 0 1-1.6-5.56c0-5.77 4.7-10.47 10.47-10.47 2.8 0 5.42 1.09 7.4 3.07a10.4 10.4 0 0 1 3.06 7.41c0 5.78-4.7 10.48-10.47 10.48Zm5.74-7.84c-.31-.16-1.86-.92-2.15-1.02-.29-.11-.5-.16-.71.16-.21.31-.82 1.02-1 1.24-.18.21-.37.24-.68.08-.31-.16-1.33-.49-2.53-1.56-.94-.83-1.57-1.86-1.75-2.18-.18-.31-.02-.48.14-.64.14-.14.31-.37.47-.55.16-.18.21-.31.31-.52.11-.21.05-.39-.03-.55-.08-.16-.71-1.71-.97-2.34-.26-.62-.52-.54-.71-.55-.18-.01-.39-.01-.6-.01-.21 0-.55.08-.84.39-.29.31-1.1 1.08-1.1 2.63 0 1.55 1.13 3.05 1.29 3.26.16.21 2.23 3.41 5.41 4.78.76.33 1.34.52 1.8.67.76.24 1.44.21 1.99.13.61-.09 1.86-.76 2.13-1.5.26-.73.26-1.36.18-1.5-.08-.13-.29-.21-.6-.37Z"/>
            </svg>
          </span>
          <div class="wa-num">341 136 5236</div>
        </div>
        <div class="wa-cta">Agenda tu primera sesión · sin compromiso</div>
        <div class="socials">
          <span class="handle">@CAPINImx</span>
          <span class="div">•</span>
          <span>FB • IG • TikTok</span>
        </div>
        <div class="loc">Tamazula de Gordiano, Jal. • <b style="color:#fff;font-weight:800;">CAPINI · Psicología</b></div>
      </div>

    </div>
  </div>

  <script>
    function fit() {
      var p = document.getElementById('poster');
      var s = Math.min(
        (window.innerWidth - 60) / 864,
        (window.innerHeight - 60) / 1152
      );
      if (s > 0 && s < 5) p.style.transform = 'scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    window.addEventListener('load', fit);
    fit();
  </script>
</body>
</html>
