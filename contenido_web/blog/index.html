<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — Capini Música para Niños</title>
  <meta name="description" content="Artículos, actividades y tips sobre música para niños. Aprende con Capini.">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --accent-teal: #4DB6AC;
      --accent-pink: #F48FB1;
      --bg-dark: #1a1a2e;
      --bg-secondary: #16213e;
      --bg-card: #0f3460;
      --text-light: #ffffff;
      --text-muted: #B2DFDB;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-secondary) 100%);
      color: var(--text-light);
      min-height: 100vh;
    }

    /* NAV */
    .nav-tabs {
      display: flex;
      background: linear-gradient(90deg, var(--accent-teal), var(--accent-pink));
      padding: 0;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(77, 182, 172, 0.3);
    }
    .nav-tab {
      flex: 1;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      border: none;
      background: none;
      color: white;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      transition: all 0.3s;
    }
    .nav-tab:hover {
      background: rgba(255,255,255,0.15);
    }
    .nav-tab.active {
      background: rgba(255,255,255,0.25);
      font-weight: 800;
    }

    /* HERO */
    .hero {
      text-align: center;
      padding: 60px 20px 40px;
      background: linear-gradient(180deg, rgba(77,182,172,0.15) 0%, transparent 100%);
    }
    .hero h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(90deg, var(--accent-teal), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }
    .hero p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* FILTROS */
    .filtros {
      display: flex;
      gap: 10px;
      padding: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .filtro {
      padding: 8px 20px;
      border-radius: 20px;
      border: 2px solid var(--accent-teal);
      background: transparent;
      color: var(--accent-teal);
      font-family: 'Nunito', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .filtro:hover, .filtro.activo {
      background: var(--accent-teal);
      color: var(--bg-dark);
    }

    /* GRID POSTS */
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* CARD */
    .card {
      background: var(--bg-card);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
      border: 1px solid rgba(77,182,172,0.2);
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(77,182,172,0.25);
    }
    .card-banner {
      height: 140px;
      background: linear-gradient(135deg, var(--accent-teal), var(--accent-pink));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
    }
    .card-body {
      padding: 20px;
    }
    .card-categoria {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(77,182,172,0.2);
      color: var(--accent-teal);
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .card-titulo {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .card-resumen {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .card-fecha {
      color: var(--accent-pink);
      font-size: 12px;
      font-weight: 600;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      overflow-y: auto;
    }
    .modal.open {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 20px;
    }
    .modal-content {
      background: var(--bg-secondary);
      border-radius: 20px;
      max-width: 800px;
      width: 100%;
      position: relative;
      border: 2px solid var(--accent-teal);
    }
    .modal-close {
      position: absolute;
      top: 16px; right: 16px;
      width: 36px; height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--accent-pink);
      color: white;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .modal-header {
      padding: 30px;
      background: linear-gradient(135deg, var(--accent-teal), var(--accent-pink));
      border-radius: 18px 18px 0 0;
    }
    .modal-header .card-categoria {
      background: rgba(255,255,255,0.25);
      color: white;
    }
    .modal-header h2 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      margin: 10px 0;
    }
    .modal-header .fecha {
      color: rgba(255,255,255,0.8);
      font-size: 14px;
    }
    .modal-body {
      padding: 30px;
    }

    /* TALLER ESPECIFICO */
    .taller-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }
    .info-box {
      background: rgba(77,182,172,0.15);
      border: 1px solid var(--accent-teal);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
    .info-box .label {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .info-box .value {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: var(--accent-teal);
    }

    .semana-card {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      border-left: 4px solid var(--accent-teal);
    }
    .semana-card.s1 { border-left-color: #FF6B9D; }
    .semana-card.s2 { border-left-color: #FFD93D; }
    .semana-card.s3 { border-left-color: #2ecc71; }
    .semana-card.s4 { border-left-color: #3498db; }

    .semana-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .semana-badge {
      background: var(--accent-teal);
      color: var(--bg-dark);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 13px;
    }
    .semana-fechas {
      color: var(--text-muted);
      font-size: 13px;
    }
    .semana-temas {
      list-style: none;
      padding: 0;
    }
    .semana-temas li {
      padding: 4px 0;
      padding-left: 20px;
      position: relative;
      color: var(--text-muted);
    }
    .semana-temas li::before {
      content: "♪";
      position: absolute;
      left: 0;
      color: var(--accent-pink);
    }

    /* CONTENIDO GENERICO */
    .post-content {
      line-height: 1.8;
      color: var(--text-muted);
      font-size: 1rem;
    }
    .post-content h3 {
      font-family: 'Montserrat', sans-serif;
      color: var(--accent-teal);
      margin: 24px 0 12px;
    }
    .post-content p {
      margin-bottom: 16px;
    }

    /* ARTICULO SEMANA */
    .semana-header-art {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      border-left: 4px solid var(--accent-pink);
    }
    .semana-header-art h2 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.4rem;
      color: var(--accent-teal);
      margin-bottom: 6px;
    }
    .semana-header-art p {
      color: var(--text-muted);
      margin: 0;
      font-size: 0.95rem;
    }

    /* SECCIONES */
    .seccion {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }
    .seccion-actividad { border-left: 4px solid #2ecc71; }
    .seccion-info { border-left: 4px solid #FFD93D; }
    .seccion-cancion { border-left: 4px solid var(--accent-pink); }
    .seccion-retos { border-left: 4px solid #3498db; }

    .seccion h4 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.15rem;
      margin-bottom: 12px;
      color: white;
    }
    .seccion p {
      color: var(--text-muted);
      margin-bottom: 14px;
      line-height: 1.7;
    }
    .seccion ol {
      padding-left: 24px;
      color: var(--text-muted);
    }
    .seccion ol li {
      margin-bottom: 8px;
      line-height: 1.6;
    }
    .seccion .tip {
      background: rgba(77,182,172,0.1);
      border-left: 3px solid var(--accent-teal);
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 12px;
    }
    .seccion .tip strong {
      color: var(--accent-teal);
    }
    .seccion .ref-link {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--accent-pink);
      text-decoration: none;
    }
    .seccion .ref-link:hover {
      text-decoration: underline;
    }

    /* NOTAS MUSICALES */
    .notas-musica {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 2px solid var(--accent-pink);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin: 16px 0;
    }
    .notas-musica .label-notas {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .notas-musica .notas {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent-teal);
      letter-spacing: 4px;
      line-height: 2;
    }

    /* RETOS */
    .retos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .reto-item {
      background: rgba(52,152,219,0.15);
      border: 1px solid rgba(52,152,219,0.4);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .reto-item .emoji {
      font-size: 1.4rem;
      flex-shrink: 0;
    }
    .reto-item .texto {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .separador {
      border: none;
      border-top: 1px solid rgba(77,182,172,0.2);
      margin: 28px 0;
    }

    .cta-btn {
      display: inline-block;
      padding: 14px 32px;
      background: linear-gradient(90deg, var(--accent-teal), var(--accent-pink));
      border: none;
      border-radius: 30px;
      color: white;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      margin-top: 20px;
      transition: transform 0.3s;
    }
    .cta-btn:hover {
      transform: scale(1.05);
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 13px;
    }
    footer a {
      color: var(--accent-teal);
      text-decoration: none;
    }

    /* GRID VACIO */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-state .emoji {
      font-size: 4rem;
      margin-bottom: 20px;
    }

    @media (max-width: 600px) {
      .hero h1 { font-size: 1.8rem; }
      .posts-grid { grid-template-columns: 1fr; }
      .taller-info { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav class="nav-tabs">
    <a class="nav-tab" href="https://capinimx.github.io/capinimx/">🏠 Inicio</a>
    <a class="nav-tab" href="https://capinimx.github.io/capinimx/musica-ninos/">🎵 Música</a>
    <a class="nav-tab" href="https://capinimx.github.io/capinimx/aprendiendo-luk/">🧠 Luk</a>
    <a class="nav-tab active" href="#">📝 Blog</a>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <h1>📝 Blog de Capini</h1>
    <p>Actividades, tips y consejos sobre música para niños</p>
  </section>

  <!-- FILTROS -->
  <div class="filtros" id="filtros"></div>

  <!-- GRID -->
  <main class="posts-grid" id="postsGrid"></main>

  <!-- MODAL -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">×</button>
      <div class="modal-header" id="modalHeader">
        <span class="card-categoria" id="modalCat"></span>
        <h2 id="modalTitle"></h2>
        <div class="fecha" id="modalDate"></div>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <footer>
    <p>🎹 Capini Música para Niños — <a href="https://capinimx.github.io/capinimx/">Volver al inicio</a></p>
  </footer>

  <script>
    const POSTS_URL = 'posts.json';
    let allPosts = [];
    let currentFilter = 'Todos';

    async function loadPosts() {
      try {
        const resp = await fetch(POSTS_URL);
        allPosts = await resp.json();
        renderFiltros();
        renderPosts(allPosts);
      } catch (e) {
        document.getElementById('postsGrid').innerHTML = `
          <div class="empty-state">
            <div class="emoji">🎵</div>
            <p>No se pudieron cargar los artículos.<br>Intenta de nuevo más tarde.</p>
          </div>`;
      }
    }

    function getCategorias() {
      const cats = ['Todos'];
      allPosts.forEach(p => {
        if (p.categoria && !cats.includes(p.categoria)) cats.push(p.categoria);
      });
      return cats;
    }

    function renderFiltros() {
      const container = document.getElementById('filtros');
      container.innerHTML = getCategorias().map(cat => `
        <button class="filtro${cat === 'Todos' ? ' activo' : ''}" onclick="filtrar('${cat}')">${cat}</button>
      `).join('');
    }

    function filtrar(cat) {
      currentFilter = cat;
      document.querySelectorAll('.filtro').forEach(f => f.classList.remove('activo'));
      event.target.classList.add('activo');
      const filtered = cat === 'Todos' ? allPosts : allPosts.filter(p => p.categoria === cat);
      renderPosts(filtered);
    }

    function renderPosts(posts) {
      const grid = document.getElementById('postsGrid');
      if (!posts.length) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="emoji">📭</div>
            <p>No hay artículos en esta categoría.</p>
          </div>`;
        return;
      }
      grid.innerHTML = posts.map(p => `
        <article class="card" onclick="openPost('${p.id}')">
          <div class="card-banner">${getEmoji(p.categoria)}</div>
          <div class="card-body">
            <span class="card-categoria">${p.categoria}</span>
            <h3 class="card-titulo">${p.titulo}</h3>
            <p class="card-resumen">${p.resumen}</p>
            <div class="card-fecha">📅 ${formatDate(p.fecha)}</div>
          </div>
        </article>
      `).join('');
    }

    function getEmoji(cat) {
      const map = { 'Taller': '🎹', 'Tips': '💡', 'Actividad': '🎨', 'Noticia': '📢', default: '🎵' };
      return map[cat] || map.default;
    }

    function formatDate(fecha) {
      if (!fecha) return '';
      const d = new Date(fecha + 'T12:00:00');
      return d.toLocaleDateString('es-MX', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function openPost(id) {
      const p = allPosts.find(x => x.id === id);
      if (!p) return;

      document.getElementById('modalCat').textContent = p.categoria;
      document.getElementById('modalTitle').textContent = p.titulo;
      document.getElementById('modalDate').textContent = '📅 ' + formatDate(p.fecha);

      // Banner gradient según categoría
      const colors = { 'Taller': '#4DB6AC', 'Tips': '#FFD93D', 'Actividad': '#F48FB1', 'Noticia': '#3498db' };
      document.getElementById('modalHeader').style.background = `linear-gradient(135deg, ${colors[p.categoria] || '#4DB6AC'}, ${colors[p.categoria] ? '#F48FB1' : '#4DB6AC'})`;

      let body = '';
      if (p.id === 'taller-vacacional-musica-2026') {
        body = renderTaller(p);
      } else {
        body = `<div class="post-content">${p.contenido || '<p>Contenido próximo...</p>'}</div>`;
      }
      document.getElementById('modalBody').innerHTML = body;
      document.getElementById('modal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function renderTaller(p) {
      const info = p.info || {};
      let html = `
        <div class="taller-info">
          <div class="info-box"><div class="label">Duración</div><div class="value">${info.duracion || '4 semanas'}</div></div>
          <div class="info-box"><div class="label">Inicio</div><div class="value">${info.inicio || '7 julio 2026'}</div></div>
          <div class="info-box"><div class="label">Edad</div><div class="value">${info.edad || '5-12 años'}</div></div>
          <div class="info-box"><div class="label">Horario</div><div class="value">${info.horario || 'Por confirmar'}</div></div>
          <div class="info-box"><div class="label">Lugar</div><div class="value">${info.lugar || 'Por confirmar'}</div></div>
          <div class="info-box"><div class="label">Costo</div><div class="value">${info.costo || 'Por confirmar'}</div></div>
        </div>
      `;

      // Si hay artículo de la semana, mostrarlo
      if (p.articulo && p.articulo.semana1) {
        const art = p.articulo.semana1;
        html += `
        <hr class="separador">
        <div class="semana-header-art">
          <h2>${art.titulo}</h2>
          <p>${art.subtitulo}</p>
        </div>`;
        (art.secciones || []).forEach(sec => {
          const tipoClass = `seccion-${sec.tipo}`;
          html += `<div class="seccion ${tipoClass}">`;
          html += `<h4>${sec.titulo}</h4>`;
          if (sec.descripcion) html += `<p>${sec.descripcion}</p>`;
          if (sec.pasos && sec.pasos.length) {
            html += `<ol>${sec.pasos.map(s => `<li>${s}</li>`).join('')}</ol>`;
          }
          if (sec.tip) html += `<div class="tip"><strong>¡Tip!</strong> ${sec.tip}</div>`;
          if (sec.notas) {
            html += `<div class="notas-musica">
              <div class="label-notas">Notas para piano</div>
              <div class="notas">${sec.notas}</div>
            </div>`;
          }
          if (sec.notasExtendidas) html += `<p><em>Melodía completa: ${sec.notasExtendidas}</em></p>`;
          if (sec.referencias && sec.referencias.length) {
            html += sec.referencias.map(r => `<a class="ref-link" href="${r}" target="_blank">→ Fuente</a>`).join(' ');
          }
          if (sec.tipo === 'retos' && sec.retos) {
            html += `<div class="retos-grid">`;
            sec.retos.forEach(r => {
              html += `<div class="reto-item"><span class="emoji">${r.emoji}</span><span class="texto">${r.texto}</span></div>`;
            });
            html += `</div>`;
          }
          html += `</div>`;
        });
        html += `<hr class="separador">`;
      }

      html += `<h3>📅 Programa por Semanas</h3>`;

      if (p.semanas) {
        p.semanas.forEach((s, i) => {
          html += `
          <div class="semana-card s${i+1}">
            <div class="semana-header">
              <span class="semana-badge">Semana ${s.semana}</span>
              <span class="semana-fechas">${s.fechas}</span>
            </div>
            <ul class="semana-temas">
              ${(s.temas || []).map(t => `<li>${t}</li>`).join('')}
            </ul>
          </div>`;
        });
      }

      html += `<a href="https://wa.me/5210000000000?text=Hola%2C%20me%20interesa%20el%20Taller%20Vacacional%20de%20Música" class="cta-btn" target="_blank">📲 Inscribirme por WhatsApp</a>`;
      return html;
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
      document.body.style.overflow = '';
    }

    document.getElementById('modal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    loadPosts();
  </script>

</body>
</html>
