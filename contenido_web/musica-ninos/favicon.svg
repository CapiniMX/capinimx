<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B2DFDB"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4DB6AC"/>
      <stop offset="100%" stop-color="#00897B"/>
    </linearGradient>
  </defs>
  <!-- rounded background -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- note stem -->
  <rect x="38" y="14" width="3.5" height="32" fill="url(#note)"/>
  <!-- note flag (curved) -->
  <path d="M 41.5 14 Q 54 18, 54 28 Q 54 22, 41.5 22 Z" fill="url(#note)"/>
  <!-- note head (oval, slightly tilted) -->
  <ellipse cx="32" cy="46" rx="11" ry="8" fill="url(#note)" transform="rotate(-22 32 46)"/>
  <!-- letter C carved into note head (white, looks half-hidden) -->
  <text x="32" y="49" font-family="Arial, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" transform="rotate(-22 32 46)" font-style="italic">C</text>
</svg>